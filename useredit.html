<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar mi perfil</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #resultado { margin-top: 12px; font-weight: bold; }
        table td { padding: 6px 10px; }
    </style>
</head>
<body>

<h2>Editar mi perfil</h2>

<div id="cargando">Cargando datos...</div>

<!-- El form empieza oculto hasta que carguen los datos del usuario -->
<form id="editForm" style="display:none;">
    <table border="1">
        <tr>
            <td>Username</td>
            <td><input type="text" id="username" name="username"></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input type="text" id="email" name="email" readonly style="background:#eee;"></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password" id="password" name="password"></td>
        </tr>
        <tr>
            <td>Phone</td>
            <td><input type="text" id="phone" name="phone"></td>
        </tr>
    </table>
    <br>
    <button type="submit">Actualizar</button>
</form>

<div id="resultado"></div>

<script>
    // 1. Al cargar la página, pedimos los datos del usuario via AJAX
    fetch("UserEdit?format=json")
        .then(function(response) { return response.json(); })
        .then(function(data) {
            document.getElementById("cargando").style.display = "none";

            if (!data.success) {
                document.getElementById("resultado").textContent = data.message;
                return;
            }

            // Rellenamos el formulario con los datos que llegaron del servidor
            document.getElementById("username").value = data.username;
            document.getElementById("email").value    = data.email;
            document.getElementById("phone").value    = data.phone;
            document.getElementById("editForm").style.display = "block";
        })
        .catch(function() {
            document.getElementById("cargando").textContent = "Error al cargar los datos.";
        });

    // 2. Al hacer submit, guardamos via AJAX sin recargar la página
    document.getElementById("editForm").addEventListener("submit", function(e) {
        e.preventDefault();

        var params = new URLSearchParams({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
            phone:    document.getElementById("phone").value,
            format:   "json"
        });

        var resultado = document.getElementById("resultado");
        resultado.style.color   = "gray";
        resultado.textContent   = "Guardando...";

        fetch("UserUpdate?" + params.toString())
            .then(function(response) { return response.json(); })
            .then(function(data) {
                resultado.style.color = data.success ? "green" : "red";
                resultado.textContent  = data.message;
            })
            .catch(function() {
                resultado.style.color = "red";
                resultado.textContent  = "Error de conexión con el servidor.";
            });
    });
</script>

</body>
</html>
