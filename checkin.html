<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Check-In de Torneo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #resultado { margin-top: 15px; font-weight: bold; font-size: 18px; }
        #loading   { display: none; color: gray; }
    </style>
</head>
<body>

<h2>Check-In de Torneo</h2>

<form id="checkinForm">
    <label>ID de Usuario:</label>
    <input type="text" id="user_id" name="user_id"><br><br>

    <label>ID del Torneo:</label>
    <input type="text" id="tournament_id" name="tournament_id"><br><br>

    <button type="submit">Realizar Check-In</button>
</form>

<p id="loading">Comprobando registro...</p>

<!-- El resultado aparece aquí sin recargar la página -->
<div id="resultado"></div>

<script>
    document.getElementById("checkinForm").addEventListener("submit", function(e) {
        e.preventDefault();  // No recargamos la página

        var userId       = document.getElementById("user_id").value.trim();
        var tournamentId = document.getElementById("tournament_id").value.trim();
        var resultado    = document.getElementById("resultado");
        var loading      = document.getElementById("loading");

        // Validación en cliente (igual que antes)
        if (userId === "" || tournamentId === "") {
            alert("Debes rellenar ambos campos.");
            return;
        }
        if (isNaN(userId) || isNaN(tournamentId)) {
            alert("Los IDs deben ser números.");
            return;
        }

        // Mostramos el mensaje de carga
        loading.style.display = "block";
        resultado.textContent  = "";

        // AJAX: llamada al servlet con format=json
        fetch("TournamentCheckIn?user_id=" + userId + "&tournament_id=" + tournamentId + "&format=json")
            .then(function(response) {
                return response.json();   // el servlet devuelve JSON
            })
            .then(function(data) {
                loading.style.display = "none";

                // Usamos el campo "status" del JSON para elegir color
                switch (data.status) {
                    case "accepted": resultado.style.color = "green";  break;
                    case "pending":  resultado.style.color = "orange"; break;
                    case "rejected": resultado.style.color = "red";    break;
                    default:         resultado.style.color = "red";    break;
                }

                resultado.textContent = data.message;
            })
            .catch(function(err) {
                loading.style.display = "none";
                resultado.style.color = "red";
                resultado.textContent  = "Error de conexión con el servidor.";
            });
    });
</script>

</body>
</html>
